<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>座席シャッフルメーカー</title>
<style>
  :root{
    --bg: #0a1420;
    --surface: #10202f;
    --surface-2: #16293b;
    --border: #24425a;
    --text: #eef7fb;
    --text-dim: #8fb0c2;
    --accent1: #22d3ee;
    --accent2: #6366f1;
    --accent-grad: linear-gradient(135deg, var(--accent1), var(--accent2));
    --good: #34d399;
    --front: #22d3ee;
    --back: #6366f1;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }
  #app{ max-width:760px; margin:0 auto; padding:24px 20px 60px; }
  h1{ font-size:clamp(22px,5vw,28px); font-weight:800; margin:4px 0 4px; }
  p.sub{ color:var(--text-dim); font-size:15px; line-height:1.7; margin:0 0 20px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:16px; }
  label{ display:block; font-weight:700; font-size:14px; margin:0 0 8px; }
  textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:12px 14px; font-size:15px; font-family:inherit;
    min-height:140px; resize:vertical; line-height:1.8;
  }
  .hint{ font-size:13px; color:var(--text-dim); margin-top:8px; }
  .row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  .btn{
    display:inline-block; border:none; cursor:pointer; background:var(--accent-grad); color:#08131c;
    font-weight:800; font-size:16px; padding:14px 22px; border-radius:14px; min-height:52px;
    box-shadow:0 6px 20px rgba(34,211,238,.25);
  }
  .btn.secondary{ background:var(--surface-2); color:var(--text); box-shadow:none; border:1px solid var(--border); }
  .btn:active{ transform:scale(.97); }
  .tabs{ display:flex; gap:8px; margin:20px 0 12px; }
  .tab{ flex:1; text-align:center; padding:10px; border-radius:12px; background:var(--surface-2); color:var(--text-dim); font-weight:700; cursor:pointer; border:1px solid var(--border); }
  .tab.active{ background:var(--accent-grad); color:#08131c; border-color:transparent; }
  .counter{ font-size:13px; color:var(--text-dim); margin-bottom:14px; }

  .board{ text-align:center; font-size:12px; font-weight:800; letter-spacing:.1em; color:var(--text-dim);
    background:var(--surface-2); border:1px dashed var(--border); border-radius:10px; padding:8px; margin-bottom:10px; }
  .seat-grid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; }
  .seat{
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:8px 4px; text-align:center; font-size:12px; font-weight:700; min-height:52px;
    display:flex; align-items:center; justify-content:center; line-height:1.3; word-break:break-all;
  }
  .seat.empty{ color:var(--text-dim); font-weight:400; opacity:.5; }
  .row-caption{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-top:10px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ padding:6px 8px; border-bottom:1px solid var(--border); text-align:center; }
  th{ color:var(--text-dim); font-weight:700; }
  td:first-child, th:first-child{ text-align:left; font-weight:700; }
  .bar-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .bar-label{ width:64px; font-size:13px; flex-shrink:0; }
  .bar-track{ flex:1; background:var(--surface-2); border-radius:6px; overflow:hidden; height:16px; }
  .bar-fill{ height:100%; background:var(--accent-grad); }
  .bar-count{ width:24px; text-align:right; font-size:12px; color:var(--text-dim); flex-shrink:0; }
  .empty-msg{ color:var(--text-dim); font-size:14px; text-align:center; padding:20px 0; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_KEY = "seat_shuffle_history_v2";
const ROWS = 6;
const COLS = 6;
const SEATS = ROWS * COLS;

let state = {
  names: [],
  current: null,
  history: load(),
  tab: "result"
};

function load(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }catch(e){ return []; }
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history)); }

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function doShuffle(){
  const raw = document.getElementById("namesInput").value;
  const names = raw.split("\n").map(s=>s.trim()).filter(Boolean);
  if(names.length === 0) return;

  const shuffled = shuffleArray(names).slice(0, SEATS);
  const seats = Array.from({length: SEATS}, (_, i) => {
    const name = shuffled[i] || null;
    return { name, row: Math.floor(i/COLS)+1, col: (i%COLS)+1 };
  });

  state.names = names;
  state.current = seats;
  state.history.push({ time: Date.now(), seats });
  save();
  render();
}

function switchTab(tab){ state.tab = tab; render(); }

function renderResult(){
  if(!state.current){
    return `<div class="empty-msg">まだシャッフルしていません。名簿を入力して「シャッフルする」を押してください。</div>`;
  }
  const filled = state.current.filter(s => s.name).length;
  return `
    <div class="counter">これまでのシャッフル回数：${state.history.length}回　／　着席：${filled}人（${SEATS}席中）</div>
    <div class="board">🖥 黒板・前方 🖥</div>
    <div class="seat-grid">
      ${state.current.map(s => `
        <div class="seat ${s.name ? '' : 'empty'}">${s.name ? escapeHtml(s.name) : '—'}</div>
      `).join("")}
    </div>
    <div class="row-caption"><span>↑ 前列（1行目）</span><span>後列（6行目）↓</span></div>
  `;
}

function renderDistribution(){
  if(state.history.length === 0){
    return `<div class="empty-msg">シャッフルするとここに分布が表示されます。</div>`;
  }
  const nameSet = new Set();
  state.history.forEach(h => h.seats.forEach(s => { if(s.name) nameSet.add(s.name); }));
  const names = Array.from(nameSet);

  const rowCounts = {}; // name -> [row1..row6]count
  names.forEach(n => rowCounts[n] = Array(ROWS).fill(0));
  state.history.forEach(h => {
    h.seats.forEach(s => { if(s.name) rowCounts[s.name][s.row-1]++; });
  });

  const rowTotals = Array(ROWS).fill(0);
  state.history.forEach(h => h.seats.forEach(s => { if(s.name) rowTotals[s.row-1]++; }));
  const maxTotal = Math.max(...rowTotals, 1);

  const tableRows = names.map(n => `
    <tr>
      <td>${escapeHtml(n)}</td>
      ${rowCounts[n].map(c => `<td>${c}</td>`).join("")}
    </tr>
  `).join("");

  return `
    <div class="counter">${state.history.length}回のシャッフルをもとに集計しています</div>

    <div style="font-weight:800; font-size:14px; margin-bottom:10px;">前列〜後列、それぞれ何回座席が埋まったか</div>
    ${rowTotals.map((t,i) => `
      <div class="bar-row">
        <div class="bar-label">${i===0?'前列 ':''}${i+1}行目</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(t/maxTotal*100).toFixed(0)}%"></div></div>
        <div class="bar-count">${t}</div>
      </div>
    `).join("")}

    <div style="font-weight:800; font-size:14px; margin:18px 0 10px;">生徒ごとの内訳（何回・何行目になったか）</div>
    <div style="overflow-x:auto;">
      <table>
        <tr><th>名前</th>${Array.from({length:ROWS},(_,i)=>`<th>${i+1}行目</th>`).join("")}</tr>
        ${tableRows}
      </table>
    </div>
    <p class="sub" style="margin-top:14px; margin-bottom:0;">
      特定の行の数字だけ突出して多い生徒がいないかチェックしてみよう。回数を重ねるほど、各行はだいたい均等に近づいていくはずです。
    </p>
  `;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <h1>座席シャッフルメーカー</h1>
    <p class="sub">名簿を入力すると、6行6列（36席）にランダムで座席を割り当てます。</p>

    <div class="card">
      <label>名簿（1行に1人）</label>
      <textarea id="namesInput" placeholder="山田太郎&#10;佐藤花子&#10;...">${state.names.join("\n")}</textarea>
      <div class="hint">最大36人まで。36人を超えた分は今回は座席に入りません。</div>
      <div class="row">
        <button class="btn" onclick="doShuffle()">🎲 シャッフルする</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab ${state.tab==='result'?'active':''}" onclick="switchTab('result')">座席表</div>
      <div class="tab ${state.tab==='dist'?'active':''}" onclick="switchTab('dist')">📊 これまでの分布</div>
    </div>

    <div class="card">
      ${state.tab === 'result' ? renderResult() : renderDistribution()}
    </div>
  `;
}

render();
</script>
</body>
</html>
